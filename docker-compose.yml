services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-shop-app
    ports:
      - "8090:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8090
      APP_KEY: "base64:M93suRWWvkf1FFMn7/UO2Oj0xGoQe08EoCSSE6EAxGM="
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: online_shop
      DB_USERNAME: online_shop
      DB_PASSWORD: online_shop_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: online-shop-mysql
    environment:
      MYSQL_DATABASE: online_shop
      MYSQL_USER: online_shop
      MYSQL_PASSWORD: online_shop_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - online-shop-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "online_shop", "-ponline_shop_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  online-shop-mysql-data:
